<body>

<main class="wrap" data-check="market-page">
  <section class="panel lit halftone mt" data-check="market">
    <div class="panel-head">
      <h2>The market</h2>
      <label class="dim small">sort
        <select id="mk-sort" class="mk-sort">
          <option value="price">cheapest first</option>
          <option value="awake">awake first</option>
          <option value="level">highest level first</option>
        </select>
      </label>
    </div>
    <p class="lede lst-lede">Every Skelly for sale on OpenSea, with what the chain says about it: awake or asleep, its level, and what's inside it. The price is OpenSea's; everything else is read live.</p>
    <div class="mk-head" id="mk-head"></div>
    <div class="mk-grid" id="mk-grid"></div>
  </section>

  <section class="panel mt" data-check="market-lookup">
    <div class="panel-head">
      <h3>Look one up</h3>
      <span class="dim small">any Skelly, listed or not</span>
    </div>
    <div class="mk-lookup">
      <input class="lst-input" id="mk-id" type="number" min="1" max="1100" placeholder="Skelly number" aria-label="Skelly number">
      <button class="btn sm sky" id="mk-go" type="button">Show me</button>
    </div>
    <div class="mt" id="mk-card"></div>
  </section>
</main>
